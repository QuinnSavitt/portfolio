[build]
publish = "theme"
command = "npm run build"

# Daily Rally became Gravl (2026-08); keep old links and bookmarks working.
[[redirects]]
from = "/games/rally/*"
to = "/games/gravl/:splat"
status = 301

[[headers]]
for = "/*" # This defines which paths this specific [[headers]] block will cover.

[headers.values]
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "same-origin"
Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# HTML is the entry point and is never fingerprinted, so it has to be checked
# on every visit. It is small and a 304 costs almost nothing.
[[headers]]
for = "/*.html"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

# Everything below carries a content hash in its filename (style-c7057f92.css).
# A changed file is a different URL, so these can be cached indefinitely and
# never revalidated. This is what the hashing bought: the previous setup had to
# revalidate every CSS and JS file on every page load to avoid serving stale
# assets against fresh markup.
[[headers]]
for = "/css/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/js/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/plugins/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/images/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# The games are standalone apps that are not fingerprinted, so they keep the
# revalidate-every-time behaviour.
[[headers]]
for = "/games/*"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"
