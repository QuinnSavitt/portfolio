<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spirograph</title>
  <link rel="icon" href="images/favicon.png?v=3" type="image/x-icon">
  <style>
    .qs-home {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 50;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #eae1cd;
      background: rgba(23, 40, 27, 0.92);
      border: 1px solid #2d4834;
      border-radius: 4px;
      padding: 8px 14px;
      text-decoration: none;
    }
    .qs-home:hover { color: #fbf7ec; border-color: #c9a227; }
  </style>
  <style>
    body {
      margin: 0;
      background: #101c14;
      color: #fbf7ec;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    canvas {
      background: #0b1410;
      margin-top: 10px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
    }

    .control {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 14px;
    }

    input[type=range] {
      width: 120px;
    }

    button {
      margin-top: 10px;
      padding: 8px 16px;
      background: #203624;
      border: none;
      border-radius: 5px;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #c9a227;
    }
  </style>
</head>
<body>
  <a class="qs-home" href="./">&larr; quinnsavitt.com</a>

  <h1>Spirograph</h1>

  <div class="controls">
    <div class="control">
      <label>Inner Radius</label>
      <input type="range" id="innerRadius" min="10" max="200" value="100">
    </div>
    <div class="control">
      <label>Outer Radius</label>
      <input type="range" id="outerRadius" min="10" max="200" value="50">
    </div>
    <div class="control">
      <label>Pen Offset</label>
      <input type="range" id="penOffset" min="1" max="100" value="40">
    </div>
    <div class="control">
      <label>Speed</label>
      <input type="range" id="speed" min="0.01" max="0.1" step="0.01" value="0.02">
    </div>
  </div>

  <button onclick="clearCanvas()">Clear</button>
  <button id="randomBtn" onclick="goToRandomPage(true)">Take Me Somewhere Else Fun</button>

  <canvas id="spiro" width="800" height="600"></canvas>

  <script>
    const canvas = document.getElementById('spiro');
    const ctx = canvas.getContext('2d');

    let angle = 0;
    let hue = 0;
    let lastX = null, lastY = null;

    function getParams() {
      return {
        R: parseFloat(innerRadius.value),
        r: parseFloat(outerRadius.value),
        d: parseFloat(penOffset.value),
        speed: parseFloat(speed.value)
      };
    }

    function drawSpirograph() {
      requestAnimationFrame(drawSpirograph);

      const { R, r, d, speed } = getParams();

      angle += speed;

      // Hypotrochoid parametric equations
      const x = (R - r) * Math.cos(angle) + d * Math.cos(((R - r) / r) * angle);
      const y = (R - r) * Math.sin(angle) - d * Math.sin(((R - r) / r) * angle);

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      const drawX = centerX + x;
      const drawY = centerY + y;

      // sweep gold through moss instead of the full rainbow, so the trace
      // stays inside the site's palette
      ctx.strokeStyle = `hsl(${36 + ((hue % 360) / 360) * 78}, 58%, 56%)`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      if (lastX !== null && lastY !== null) {
        ctx.moveTo(lastX, lastY);
      } else {
        ctx.moveTo(drawX, drawY);
      }
      ctx.lineTo(drawX, drawY);
      ctx.stroke();

      lastX = drawX;
      lastY = drawY;
      hue = (hue + 1) % 360;
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      lastX = null;
      lastY = null;
    }

    drawSpirograph();
  </script>

  <script src="js/fun.js"></script>
</body>
</html>
