<!DOCTYPE html>
<html lang="en">
<head>

  <!-- ** Basic Page Needs ** -->
  <meta charset="utf-8">
  <title>@@title</title>

  <!-- ** Mobile Specific Metas ** -->
  <meta name="description" content="@@description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="author" content="Quinn Savitt">
  <meta name="theme-color" content="#0c0f15" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">

  <!-- Google Fonts sit on two separate origins and each needs its own DNS +
       TLS handshake before a single glyph arrives; warming them here overlaps
       that with parsing. display=swap means text paints in a fallback face
       immediately rather than staying invisible until the webfont lands. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Libre+Baskerville:400,400i|Open+Sans:400,600,700,800&display=swap">

  <!-- Essential Stylesheets -->
  <link rel="stylesheet" href="plugins/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="plugins/icons/icons.css">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <!--Favicon-->
  <link rel="icon" href="images/favicon.png" type="image/png">

  <!-- Set the theme before first paint, otherwise a dark-mode visitor gets a
       white flash on every page load. Falls back to the OS preference. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("qs-theme");
        var dark = saved ? saved === "dark"
          : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        // on <html>, not <body>: body does not exist yet at this point, and
        // every rule in dark.scss is `.dark` plus a descendant selector
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    })();
  </script>

</head>
<body>

  <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
    <i class="tf-ion-ios-moon"></i>
  </button>

  <!-- Intro wipe. Driven entirely by CSS animation (see style.scss) so it
       starts at first paint and can never stick around waiting on a load
       event that already fired. aria-hidden: it is pure decoration. -->
  <div class="preloader" aria-hidden="true">
    <div class="loading-mask"></div>
    <div class="loading-mask"></div>
    <div class="loading-mask"></div>
    <div class="loading-mask"></div>
    <div class="loading-mask"></div>
  </div>
