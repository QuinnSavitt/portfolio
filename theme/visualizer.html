<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Music Visualizer</title>
  <link rel="icon" href="images/favicon.png" type="image/x-icon">
  <style>
    .qs-home {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 50;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #eae1cd;
      background: rgba(23, 40, 27, 0.92);
      border: 1px solid #2d4834;
      border-radius: 4px;
      padding: 8px 14px;
      text-decoration: none;
    }
    .qs-home:hover { color: #fbf7ec; border-color: #c9a227; }
  </style>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      color: white;
      background: #101c14;
      overflow: hidden;
      text-align: center;
    }

    h1 {
      margin: 20px 0 10px;
    }

    #controls {
      margin-bottom: 10px;
      z-index: 10;
      position: relative;
    }

    button {
      margin: 0 5px;
      padding: 8px 16px;
      border: none;
      border-radius: 5px;
      background: #203624;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #2d4834;
    }

    button.active {
      background: #c9a227;
    }

    label {
      margin: 0 8px;
      font-size: 14px;
    }

    input[type="file"] {
      margin: 10px auto;
      display: block;
      z-index: 10;
      position: relative;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
    }

    .checkbox-group {
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <a class="qs-home" href="./">&larr; quinnsavitt.com</a>

  <h1>Music Visualizer</h1>

  <div id="controls">
    <button id="hypeBtn" class="active">Hype</button>
    <button id="deepBtn">Deep</button>
    <button id="randomBtn" onclick="goToRandomPage(true)">Take Me Somewhere Else Fun</button>

    <div class="checkbox-group">
      <label><input type="checkbox" id="toggleBars" checked /> Bars</label>
      <label><input type="checkbox" id="toggleWave" checked /> Waveform</label>
      <label><input type="checkbox" id="toggleBurst" checked /> Starburst</label>
      <label><input type="checkbox" id="toggleBG" checked /> Background</label>
    </div>
  </div>

  <input type="file" id="fileUpload" accept="audio/*" />
  <canvas id="visualizer"></canvas>

  <script>
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const fileInput = document.getElementById('fileUpload');
    const hypeBtn = document.getElementById('hypeBtn');
    const deepBtn = document.getElementById('deepBtn');

    const toggleBars = document.getElementById('toggleBars');
    const toggleWave = document.getElementById('toggleWave');
    const toggleBurst = document.getElementById('toggleBurst');
    const toggleBG = document.getElementById('toggleBG');

    let audioCtx, analyser, source, dataArray, timeArray, bufferLength;
    let particles = [];
    let mood = 'hype';

    const colors = {
      // embers and gold when it is loud, deep forest when it is not
      hype: {
        bg: (bass) => `rgb(${Math.min(24 + bass, 92)}, ${Math.min(16 + bass * 0.55, 58)}, 12)`,
        bar: (val) => `rgb(${Math.min(120 + val, 236)}, ${Math.min(88 + val * 0.55, 178)}, 46)`,
        wave: '#e6c65f',
        burst: 'rgba(251, 247, 236, 0.8)',
      },
      deep: {
        bg: () => 'rgb(11, 20, 16)',
        bar: () => 'rgba(125, 155, 106, 0.32)',
        wave: 'rgba(201, 162, 39, 0.55)',
        burst: 'rgba(234, 225, 205, 0.12)',
      }
    };

    function switchMood(newMood) {
      mood = newMood;

      hypeBtn.classList.toggle('active', mood === 'hype');
      deepBtn.classList.toggle('active', mood === 'deep');

      if (mood === 'hype') {
        toggleBars.checked = true;
        toggleWave.checked = true;
        toggleBurst.checked = true;
        toggleBG.checked = true;
      } else if (mood === 'deep') {
        toggleBars.checked = true;
        toggleWave.checked = true;
        toggleBurst.checked = false;
        toggleBG.checked = true;
      }
    }

    hypeBtn.onclick = () => switchMood('hype');
    deepBtn.onclick = () => switchMood('deep');

    function spawnParticles(x, y) {
      for (let i = 0; i < (mood === 'deep' ? 5 : 20); i++) {
        particles.push({
          x, y,
          dx: (Math.random() - 0.5) * (mood === 'deep' ? 1 : 4),
          dy: (mood === 'deep' ? -Math.random() * 2 : (Math.random() - 0.5) * 4),
          life: 60,
          color: colors[mood].burst
        });
      }
    }

    function drawParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 2, 2);
        p.x += p.dx;
        p.y += p.dy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    fileInput.addEventListener('change', function () {
      const file = this.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        const audio = new Audio();
        audio.src = e.target.result;
        audio.crossOrigin = "anonymous";
        audio.controls = true;
        document.body.appendChild(audio);
        audio.style.position = 'absolute';
        audio.style.bottom = '10px';
        audio.style.left = '50%';
        audio.style.transform = 'translateX(-50%)';
        audio.play();

        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        source = audioCtx.createMediaElementSource(audio);
        analyser = audioCtx.createAnalyser();
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        analyser.fftSize = 2048;

        bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);
        timeArray = new Uint8Array(bufferLength);

        animate();
      };
      reader.readAsDataURL(file);
    });

    function animate() {
      requestAnimationFrame(animate);

      analyser.getByteFrequencyData(dataArray);
      analyser.getByteTimeDomainData(timeArray);

      const bass = dataArray.slice(0, 8).reduce((a, b) => a + b, 0) / 8;

      if (toggleBG.checked) {
        document.body.style.backgroundColor = colors[mood].bg(bass);
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (toggleBars.checked) {
        const barWidth = canvas.width / bufferLength * 2.5;
        let x = 0;
        for (let i = 0; i < bufferLength; i++) {
          const barHeight = dataArray[i];
          ctx.fillStyle = colors[mood].bar(barHeight);
          ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
          x += barWidth;
        }
      }

      if (toggleWave.checked) {
        ctx.beginPath();
        ctx.lineWidth = 2;
        ctx.strokeStyle = colors[mood].wave;
        let sliceWidth = canvas.width / bufferLength;
        let x = 0;
        for (let i = 0; i < bufferLength; i++) {
          const v = timeArray[i] / 128.0;
          const y = (v * canvas.height) / 2;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
          x += sliceWidth;
        }
        ctx.stroke();
      }

      if (toggleBurst.checked && bass > 100) {
        spawnParticles(canvas.width / 2, canvas.height / 2);
      }

      drawParticles();
    }

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>

  <script src="js/fun.js"></script>
</body>
</html>
